<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пошук найкоротшого шляху в коледжі</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Навігатор коледжу
      <button id="info">?</button>
    </h1> 
    
    <div class="info-block" style="display: none;">
      <p>Можна використовувати додаткові функції: перемикання між поверхами за допомогою стрілок на клавіатурі та вибір точок кліком по карті.</p>
      <p>Приємного користування і більше не блукай коледжом (˶ᵔ ᵕ ᵔ˶)</p>
    </div>
  </header>

  <div class="route-panel">
    <input type="text" id="start-point" list="points-list" placeholder="Звідки...">
    <span class="route-arrow">→</span>
    <input type="text" id="end-point" list="points-list" placeholder="Куди...">
    <button id="find-route-btn">Знайти</button>
    <button id = "alt-route-btn">Змінити маршрут</button>
  </div>

  <datalist id="points-list"></datalist>

  <main class="main">
    
    <aside class="buttons">
      <button class="floor-btn" data-floor="3">3 поверх</button>
      <div class="arrow" id="arrow-3-2">
        <span class="arrow-ap">↑</span>
        <span class="arrow-ap">↓</span>
      </div>

      <button class="floor-btn" data-floor="2">2 поверх</button>

      <div class="arrow" id="arrow-2-1">
        <span class="arrow-ap">↑</span>
        <span class="arrow-ap">↓</span>
      </div>

      <button class="floor-btn active" data-floor=1 >1 поверх</button>
    </aside>
    
    <svg class="svgMap" viewBox="0 0 820 450">
      <image href="images/1_поверх.svg" alt="Перший поверх" class="active"/>
      <image href="images/2_поверх.svg" alt="Другий поверх"/>
      <image href="images/3_поверх.svg" alt="Третій поверх"/>
    
      <g class="route-layer"></g>
    </svg>
  </main>

  
  
  
</body>
</html>
